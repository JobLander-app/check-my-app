name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generate the workerd Prisma client (output is gitignored).
      - run: npx prisma generate
      - run: npm run typecheck # web app (tsc)
      - run: npm run agent:typecheck # agent worker (tsc)
      - run: npm run lint
      # The acceptance registry, discovered by mask (CHE-183). Every
      # scripts/verify-*.{ts,mjs} runs here — the one-attempt credential rule
      # (CHE-100), the doer's rails, the merge gate (CHE-122) and the rest; each
      # script's header says what it proves and which ticket asked for it.
      # This used to be one `- run: npm run verify:…` step per script. Each new
      # script added a line at the same spot here and in package.json, so every
      # merge conflicted every open PR: on 2026-09-05 two sessions merging in
      # parallel spent the day rebasing each other (#40 → #41/#42/#43, #38/#39 →
      # #40/#43). Now a new verify script is picked up automatically — do not add
      # a step for it. The runner fails on any non-zero exit, timeout or missing
      # runner, and prints a PASS/FAIL table at the end (scripts/verify-all.mjs).
      - run: npm run verify:all
      # Smoke-build the web worker via OpenNext (catches bundle/runtime issues).
      - run: npx opennextjs-cloudflare build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Gate: deploy only once Cloudflare creds exist (and R2/Workers Paid are
      # enabled on the account). Until then the pipeline is green and skips
      # deploy — it activates automatically when the secret is added.
      - name: Check deploy credentials
        id: creds
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ready != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy (CHE-19 awaits R2 + Workers Paid)."

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        run: npx prisma generate
      # Wait for an extension check to finish before touching production. A
      # deploy rolls the container image and an extension run in flight dies
      # with it, leaving a paid session nobody stops (CHE-272). Before the
      # migrations, because those touch production too.
      - if: steps.creds.outputs.ready == 'true'
        run: npx tsx --tsconfig tsconfig.json scripts/deploy-gate-extension.ts
      # Apply D1 migrations to the remote database before deploying.
      - if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply checkmyapp --remote
      # Deploy the agent worker first (it defines the CheckRunWorkflow the web
      # worker binds to cross-worker).
      - if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler-agent.jsonc
      # Build + deploy the web worker (OpenNext). The build must run with the
      # same .env as a local deploy: Next.js bakes NEXT_PUBLIC_* AND server env
      # (Clerk keys etc.) into the workerd bundle at build time — without them
      # every SSR page 500s with "Missing publishableKey" (incident 2026-08-16).
      # WEB_BUILD_DOTENV is the owner's .env stored as a single GitHub secret.
      - if: steps.creds.outputs.ready == 'true'
        run: printf '%s\n' "$WEB_BUILD_DOTENV" > .env
        env:
          WEB_BUILD_DOTENV: ${{ secrets.WEB_BUILD_DOTENV }}
      - if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build
      - if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy
      # CHE-326: rewrite the owner's plans & limits page in Notion from the code
      # that just shipped (src/lib/plans.ts + src/lib/plan-catalog.ts). After
      # the deploy, so the page says what production does. Notion being down
      # must never fail a deploy that already succeeded: the step is
      # continue-on-error, and a failure is logged as a warning on the run.
      - name: Sync plans page to Notion
        if: steps.creds.outputs.ready == 'true'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::NOTION_TOKEN not set — plans page in Notion not synced."
            exit 0
          fi
          npx tsx --tsconfig tsconfig.json scripts/sync-plans-notion.ts \
            || { echo "::warning::Notion plans page sync failed — the deploy is fine, the page is stale until the next one."; exit 1; }
