# Mender — the OpenCode agent that takes CHE tickets (owner, 2026-10-07; CHE-445,
# the ticket that names this workflow). Label a CHE issue `mender`; at the event
# that files it, or at the next deploy of main, Mender reads it (Linear + Notion
# over MCP), opens a PR, asks CodeRabbit to review, works through up to three
# review rounds, and reports on the ticket.
# The PR merges itself (mender-gate.yml, CHE-486; owner 2026-10-15). It used to
# wait for a person, and ten PRs waited for days. scripts/mender/agent.mjs is the
# whole procedure.
#
# The model is OpenRouter's, paid in dollars (OPENROUTER_API_KEY), never the
# owner's Claude subscription.
#
# Two jobs, two machines (Codex, #298): the model runs in `work`, where no token
# can write to GitHub and the checkout keeps no credential; its only output is a
# patch and a report. `publish` runs on a fresh machine from a fresh checkout of
# main — nothing the model touched — refuses a patch that changes the workflows
# or Mender itself, and only then uses the personal token (so the PR starts CI).

name: Mender

on:
  # No timer (owner, 2026-10-15: no crons; CHE-486). Mender is started by the
  # event that has work for it: a ticket filed for it (the agent worker's
  # wakeMender, src/agent/mender-dispatch.ts), a review on its PR, its own chain.
  workflow_dispatch:
    inputs:
      ticket:
        description: "A CHE identifier to take now (e.g. CHE-123); empty = the queue"
        required: false
  # A review on a Mender PR starts its round now, not at the next schedule
  # (which GitHub fired every 4–7 h; CHE-445). The job below runs only for
  # CodeRabbit or Codex (asked by the gate, CHE-486) on mender/ branches, and
  # always from main's files.
  pull_request_review:
    types: [submitted]
  # The safety net, still with no clock: after every deploy of main, one look at
  # the queue (peek ends an idle look in seconds). A wake GitHub refused, a
  # ticket labelled `mender` by hand, a key raised after an alarm — the next
  # deploy picks each up (CodeRabbit, #357).
  workflow_run:
    workflows: ["CI / Deploy"]
    types: [completed]
    branches: [main]

# One unit of work at a time: two ticks would take the same ticket.
concurrency:
  group: mender-agent
  cancel-in-progress: false

jobs:
  work:
    if: >-
      github.event_name != 'pull_request_review' ||
      (startsWith(github.event.pull_request.head.ref, 'mender/') &&
        (github.event.review.user.login == 'coderabbitai[bot]' || github.event.review.user.login == 'chatgpt-codex-connector[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    outputs:
      work: ${{ steps.peek.outputs.work }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Read-only and before npm ci: an idle tick ends here in seconds.
      - id: peek
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ inputs.ticket }}
        run: node scripts/mender/agent.mjs peek
      - if: steps.peek.outputs.work == 'yes'
        run: npm ci
      - if: steps.peek.outputs.work == 'yes'
        run: npx prisma generate
      - if: steps.peek.outputs.work == 'yes'
        run: npm install -g opencode-ai@1.18.35
      # GH_TOKEN here is the job's read-only token (listing PRs and review
      # comments); the script removes it from the model's environment too.
      - name: Work
        if: steps.peek.outputs.work == 'yes'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          NOTION_TOKEN: ${{ secrets.MENDER_NOTION_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ inputs.ticket }}
          MENDER_DIR: ${{ runner.temp }}/mender
          MENDER_MODEL: anthropic/claude-sonnet-5.5
          MENDER_BUDGET: "5"
        run: node scripts/mender/agent.mjs work
      - uses: actions/upload-artifact@v4
        if: steps.peek.outputs.work == 'yes'
        with:
          name: mender
          path: ${{ runner.temp }}/mender
          if-no-files-found: error

  publish:
    needs: work
    if: needs.work.outputs.work == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # 22.18+ imports src/lib/verdict-language.ts natively: publish checks an
      # answer to a pilot report against the customer-language rules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: mender
          path: ${{ runner.temp }}/mender
      - name: Publish
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ secrets.MENDER_GH_TOKEN }}
          MENDER_DIR: ${{ runner.temp }}/mender
          MENDER_MODEL: anthropic/claude-sonnet-5.5
        run: node scripts/mender/agent.mjs publish
