# Mender's merge gate (CHE-486). Owner, 2026-10-15: «да, пусть все мержится
# само, но нужно подключить self healing loop … все равно монитор на следующем
# тике все поймает». A Mender pull request merges itself once CI is green on its
# head and the review had its say (scripts/mender/gate.mjs decides; agent.mjs
# `gate` acts). No model runs here, and nothing runs on a timer. The gate wakes
# when something that can change its answer happens —
#   - CI / Deploy finished on a mender/ branch;
#   - Codex answered (its summary comment is created or edited);
#   - a Mender tick ended (a round pushed, a PR opened);
#   - by hand.
# A separate workflow so a two-hour Mender tick never holds a merge in its queue.
#
# The watch runs here too (CHE-486 part 4), in the same concurrency group, so a
# revert never races a merge: the agent worker dispatches this workflow with
# `watch` = the ticket it filed for a new production error and `seen` = when.
# If that came right after a deploy of Mender's alone, the deploy is reverted.

name: Mender gate

on:
  workflow_run:
    workflows: ["CI / Deploy", "Mender"]
    types: [completed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "One PR number to decide; empty = every open Mender PR"
        required: false
      watch:
        description: "The watch instead of the gate: the ticket filed for a new production error (CHE-123)"
        required: false
      seen:
        description: "With watch: when the error was first seen (ISO time); empty = now"
        required: false

concurrency:
  group: mender-gate
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'Mender' ||
        (github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'mender/')))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    # A merge may wait up to 20 minutes for production's checks to finish.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The personal token: a merge by GITHUB_TOKEN would start no CI, so main
      # would never deploy. CODEX_REVIEW_TOKEN is the owner's identity, the only
      # one Codex answers (CHE-155).
      - name: Gate
        env:
          GH_TOKEN: ${{ secrets.MENDER_GH_TOKEN }}
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Read-only use: how many checks are running before a merge starts a deploy.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATE_PR: ${{ inputs.pr || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || '' }}
          WATCH_TICKET: ${{ inputs.watch }}
          WATCH_SEEN: ${{ inputs.seen }}
        run: node scripts/mender/agent.mjs ${{ inputs.watch && 'watch' || 'gate' }}
