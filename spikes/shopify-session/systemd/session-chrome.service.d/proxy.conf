# CHE-333 (2026-10-04): Chrome goes through the local forwarder to the
# residential egress when /etc/session-host/proxy.env says so (written by
# /opt/session-host/proxy-render.sh), and directly when the file is absent.
[Unit]
Wants=session-proxy.service
After=session-proxy.service

[Service]
EnvironmentFile=-/etc/session-host/proxy.env
ExecStart=
ExecStart=/usr/bin/google-chrome-stable --user-data-dir=/var/lib/session-browser/profile --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check --password-store=basic --hide-crash-restore-bubble --window-position=0,0 --window-size=1366,900 --start-maximized $CHROME_PROXY_ARGS https://admin.shopify.com
